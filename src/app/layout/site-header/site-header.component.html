<header class="site-header" [class.menu-open]="menuOpen()">
  @if (menuOpen()) {
    <button
      type="button"
      class="nav-backdrop"
      (click)="closeMenu()"
      aria-label="Fermer le menu"
    ></button>
  }

  <div class="wrap bar">
    <app-brand-mark tone="light" />

    <button
      type="button"
      class="menu-btn"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="site-nav"
      class="nav"
      [class.is-open]="menuOpen()"
      aria-label="Navigation"
    >
      @for (link of links; track link.key) {
        @if ('route' in link) {
          <a
            class="nl"
            [class.nl--cta]="link.cta"
            [class.is-active]="linkActive(link)"
            [attr.aria-current]="linkActive(link) ? 'page' : null"
            [routerLink]="link.route"
            appRememberReturn
            (click)="closeMenu()"
            >{{ link.key | t }}</a
          >
        } @else {
          <a
            class="nl"
            [class.is-active]="linkActive(link)"
            [attr.aria-current]="linkActive(link) ? 'page' : null"
            routerLink="/"
            [fragment]="link.fragment"
            (click)="closeMenu()"
            >{{ link.key | t }}</a
          >
        }
      }
      <div class="lang" role="group" aria-label="Langue / Language">
        <button
          type="button"
          [attr.aria-pressed]="lang.lang() === 'fr'"
          (click)="setLang('fr')"
        >
          FR
        </button>
        <button
          type="button"
          [attr.aria-pressed]="lang.lang() === 'en'"
          (click)="setLang('en')"
        >
          EN
        </button>
      </div>
    </nav>
  </div>
</header>
