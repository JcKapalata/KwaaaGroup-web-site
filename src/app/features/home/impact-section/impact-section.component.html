<section class="impact block" id="impact" aria-labelledby="im-t">
  <div class="wrap">
    <div class="head" appScrollReveal>
      <div>
        <p class="eyebrow">{{ 'im.eyebrow' | t }}</p>
        <h2 id="im-t" appTextReveal>{{ 'im.t' | t }}</h2>
      </div>
      <p class="text-justify">{{ 'im.p' | t }}</p>
    </div>

    <div class="grid3">
      @for (item of items; track item.route; let i = $index) {
        <a
          class="imp"
          [routerLink]="item.route"
          appRememberReturn
          appScrollReveal
          [appScrollRevealDelay]="i * 70"
        >
          <span class="tag">
            @if ('tagKey' in item) {
              {{ item.tagKey | t }}
            } @else {
              {{ item.tag }}
            }
          </span>
          <h3>{{ item.tKey | t }}</h3>
          <p class="text-justify">{{ item.pKey | t }}</p>
          <span class="more">{{ 'more' | t }}</span>
        </a>
      }
    </div>
  </div>
</section>
