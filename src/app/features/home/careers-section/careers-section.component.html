<section class="jobs block" id="carrieres" aria-labelledby="jo-t">
  <div class="wrap jobs__grid">
    <div appScrollReveal>
      <p class="eyebrow">{{ 'jo.eyebrow' | t }}</p>
      <h2 id="jo-t" appTextReveal>{{ 'jo.t' | t }}</h2>
      <p class="intro text-justify">{{ 'jo.p' | t }}</p>
      <div class="ctas">
        <a class="btn btn-gold" [href]="applyHref">{{ 'jo.cta' | t }}</a>
        <a class="btn btn-line" routerLink="/emploi" appRememberReturn>{{ 'lk.jobs' | t }}</a>
      </div>
      <p class="mail-note">
        {{ 'jo.mail' | t }}
        <a [href]="applyHref"><strong>{{ email }}</strong></a>
      </p>
    </div>

    <div class="perks">
      @for (perk of perks; track perk.tKey; let i = $index) {
        <div class="perk" appScrollReveal [appScrollRevealDelay]="i * 70">
          <mat-icon>{{ perk.icon }}</mat-icon>
          <div>
            <h3>{{ perk.tKey | t }}</h3>
            <p class="text-justify">{{ perk.pKey | t }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
